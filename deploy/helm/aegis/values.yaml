# Run ONE replica: rate limits and approvals are in-process (see docs/THREAT_MODEL.md).
image:
  repository: ghcr.io/anishtavva2002/aegis
  tag: "1.2.0"
  pullPolicy: IfNotPresent

# Name of an existing Secret holding the admin token under key `admin-token`.
adminTokenSecret: aegis-admin

# Policy YAML, mounted read-only at /etc/aegis/policy.yaml.
policy: |
  version: 1
  agents: {}

persistence:
  enabled: false        # false: audit log lives on an emptyDir and is lost with the pod
  size: 1Gi

service:
  port: 8080

resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}
