[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-execution-sandbox"
version = "1.0.0"
description = "A policy-based, Docker-isolated Python execution sandbox."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["docker>=7.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
